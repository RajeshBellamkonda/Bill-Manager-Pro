name: Send Bill Notifications

on:
  schedule:
    # Cron is UTC-only. 10:00 London = 09:00 UTC (BST) or 10:00 UTC (GMT), so schedule
    # both and let the "Check London time" step skip whichever isn't 10:00 local.
    - cron: '0 9 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch: # allow manual trigger from GitHub Actions tab

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check London time
        id: time
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(TZ=Europe/London date +%H)" = "10" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not 10:00 in London — skipping"
          fi

      - uses: actions/checkout@v4
        if: steps.time.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.time.outputs.run == 'true'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        if: steps.time.outputs.run == 'true'
        run: npm ci
        working-directory: scripts

      - name: Send scheduled notifications
        if: steps.time.outputs.run == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node send-notifications.js
        working-directory: scripts
